aid: copthis
name: CopThis
description: >-
  CopThis is the company behind Merchbar, the official online merchandise
  retailer for musicians and artists, selling authenticated band and artist
  merch (vinyl, apparel, accessories) across thousands of artist stores.
  CopThis operates the Merchbar Partner API — a REST contract that merchandise
  and fulfillment partners implement so Merchbar can list a partner's stores and
  merchandise and place, track, update, and cancel orders on behalf of Merchbar
  customers. The API uses HTTP Basic authentication over HTTPS, a JSON envelope
  with a top-level data key and pagination for collections, URI-path versioning
  (v1), and an error envelope for 4xx/5xx responses. CopThis is a portfolio
  company of 500 Global.
