openapi: 3.1.0
info:
  title: Merchbar Partner API
  version: '1.0'
  description: >-
    The Merchbar Partner API is the REST contract a merchandise partner
    implements so that Merchbar (operated by CopThis) can list a partner's
    stores and merchandise and place, track, update, and cancel orders on
    behalf of Merchbar customers. Partners host both a staging and a production
    implementation of this contract. Authentication is HTTP Basic over HTTPS;
    responses use a JSON envelope with a top-level `data` key (and `pagination`
    for collections), and errors return an `error` key with a 4xx/5xx status.
  contact:
    name: Merchbar (CopThis)
    url: https://github.com/CopThis/partner-api
  x-source: https://github.com/CopThis/partner-api/blob/master/partner_api.md
  x-note: >-
    Faithfully transcribed from the published Merchbar Partner API documentation
    (partner_api.md). This is a partner-implemented contract; each partner hosts
    the API at their own base host, so the server below is a template variable.
servers:
  - url: https://{partnerHost}/v1
    description: Partner-hosted API base (staging or production); versioned via URI path.
    variables:
      partnerHost:
        default: api.partner.example.com
        description: The partner's own API host that implements this contract.
tags:
  - name: Stores
    description: Partner stores (typically one per artist) and their merchandise.
  - name: Orders
    description: Order previews, creation, tracking, address updates, and cancellation.
security:
  - basicAuth: []
paths:
  /stores:
    get:
      operationId: listStores
      tags: [Stores]
      summary: List stores
      description: >-
        Returns a list of stores. Typically one store is assigned per artist.
        Stores can be hidden from Merchbar users with `visible: false`.
        Paginated unless the number of stores is small.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A paginated list of stores.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StoreSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
              example:
                data:
                  - { id: 1, title: Artist Name, visible: true }
                  - { id: 2, title: Another Artist, visible: false }
                pagination: { current_page: 1, per_page: 10, total_pages: 1 }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /stores/{id}:
    get:
      operationId: getStore
      tags: [Stores]
      summary: Get store metadata
      description: >-
        Returns extended store metadata. Merchbar polls this endpoint for every
        store at least once a day to keep store status up to date.
      parameters:
        - name: id
          in: path
          required: true
          description: Store identifier (string or integer).
          schema: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Store metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Store' }
              example:
                data:
                  id: 1
                  title: Artist Name
                  description: The official store of Artist Name!
                  photo: https://dt72k0ec4onep.cloudfront.net/JSNEMSDE92381733.JPG
                  visible: true
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /stores/{id}/merch:
    get:
      operationId: listStoreMerch
      tags: [Stores]
      summary: List store merchandise
      description: >-
        Returns a paginated list of merchandise within a specific store.
        Merchbar polls this endpoint for every store at least once a day to keep
        item quantities up to date. Each merch item is a single design in a
        single color; sizes/fits are expressed as `variants`.
      parameters:
        - name: id
          in: path
          required: true
          description: Store identifier.
          schema: { $ref: '#/components/schemas/Identifier' }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A paginated list of merchandise.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Merch' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /order_previews:
    post:
      operationId: createOrderPreview
      tags: [Orders]
      summary: Preview an order
      description: >-
        Returns an order preview: a reiteration of the input line items plus a
        total shipping cost estimate and shipping options. Unavailable items are
        flagged with `available: false` and excluded from the shipping estimate.
        Returns an error for non-US countries where international shipping is not
        supported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200':
          description: An order preview with shipping options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderPreview' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /orders:
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Create an order
      description: >-
        Creates a new order. If any requested item is no longer available the
        entire order fails. Requires a `selected_shipping_option_id` from a
        prior preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OrderInput'
                - type: object
                  required: [selected_shipping_option_id]
                  properties:
                    selected_shipping_option_id:
                      type: string
                      description: The shipping option id chosen from an order preview.
      responses:
        '200':
          description: The created order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /orders/{order_id}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get order status
      description: Returns the current status of an order, including tracking number once shipped.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateOrderAddress
      tags: [Orders]
      summary: Update order shipping address
      description: >-
        Updates the shipping address for an order. Merchbar sends only the
        `address` field. Returns an error if changing the address is not allowed
        or would change the shipping cost.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: '#/components/schemas/Address' }
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
  /orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order
      description: >-
        Cancels an order. The response body is ignored by Merchbar as long as it
        is not an error; by REST convention the (now CANCELLED) order object is
        returned.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic Authentication over HTTPS. Merchbar recommends a randomly
        generated token as the username and a blank password. Non-TLS
        connections are rejected.
  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of items per page.
      schema: { type: integer }
    Page:
      name: page
      in: query
      required: false
      description: Current page number (1-indexed).
      schema: { type: integer }
    OrderId:
      name: order_id
      in: path
      required: true
      description: Order identifier.
      schema: { $ref: '#/components/schemas/Identifier' }
  responses:
    Error:
      description: An error response with a 4xx or 5xx status.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            simple:
              value: { error: Forbidden }
            detailed:
              value: { error: { code: item_unavailable, message: SKU123 is no longer available } }
  schemas:
    Identifier:
      description: Object identifier; may be a string or integer (stored as string by Merchbar).
      oneOf:
        - { type: string }
        - { type: integer }
    Pagination:
      type: object
      properties:
        current_page: { type: integer, description: The current page (1-indexed). }
        per_page: { type: integer, description: Page size. }
        total_pages: { type: integer, description: Number of pages accessible. }
    Error:
      type: object
      required: [error]
      description: >-
        Error envelope. `error` may be a simple string or an object with details.
      properties:
        error:
          oneOf:
            - { type: string }
            - { type: object }
    StoreSummary:
      type: object
      required: [id, title, visible]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        title: { type: string }
        visible: { type: boolean, description: If false, the store's merchandise is hidden from Merchbar users. }
    Store:
      allOf:
        - $ref: '#/components/schemas/StoreSummary'
        - type: object
          properties:
            description: { type: string, description: Store description (basic HTML supported). }
            photo: { type: string, format: uri, description: Store image URL. }
    Variant:
      type: object
      required: [id, title, quantity, price, currency]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        title: { type: string }
        quantity: { type: integer }
        price: { type: string, description: Price as a string without a currency marker, e.g. "15.99". }
        currency: { type: string, description: ISO 4217 currency code, e.g. USD. }
        sale_price:
          type: [string, 'null']
          description: Current sale price if the item is on sale, else null.
    Merch:
      type: object
      required: [id, title, price, currency, quantity, visible, status]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        title: { type: string }
        description: { type: string, description: Item description (basic HTML supported). }
        color: { type: string }
        price: { type: string, description: Price as a string without a currency marker. }
        currency: { type: string }
        quantity: { type: integer }
        sale_price:
          type: [string, 'null']
        visible: { type: boolean }
        status:
          type: string
          enum: [available, backorder, preorder]
        available_date:
          type: [string, 'null']
          format: date
          description: Availability date for backorder/preorder items (ISO 8601 date), if known.
        photos:
          type: array
          items: { type: string, format: uri }
          description: Product image URLs in preferred order.
        variants:
          type: array
          description: Size/fit variants; omitted entirely when the item has no variants.
          items: { $ref: '#/components/schemas/Variant' }
    Address:
      type: object
      required: [first_name, last_name, line1, city, state, postal_code, country]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        line1: { type: string }
        line2: { type: [string, 'null'] }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 country code; defaults to US. }
    LineItemInput:
      type: object
      required: [id, quantity]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        variant_id: { $ref: '#/components/schemas/Identifier' }
        quantity: { type: integer }
    LineItem:
      allOf:
        - $ref: '#/components/schemas/LineItemInput'
        - type: object
          properties:
            available: { type: boolean }
    ShippingOption:
      type: object
      required: [id, title, price, currency]
      properties:
        id: { type: string }
        title: { type: string }
        ship_date: { type: string, format: date }
        ship_time: { type: string, description: Human-readable delivery estimate, e.g. "2-3 business days". }
        price: { type: string }
        currency: { type: string }
    OrderInput:
      type: object
      required: [address, line_items]
      properties:
        address: { $ref: '#/components/schemas/Address' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/LineItemInput' }
    OrderPreview:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        shipping_options:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
    Order:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        created: { type: string, format: date-time }
        status:
          type: string
          enum: [RECEIVED, SHIPPED, CANCELLED]
        tracking_number:
          type: [string, 'null']
          description: Provided only when status is SHIPPED.
        ship_date: { type: string, format: date }
        address: { $ref: '#/components/schemas/Address' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        shipping: { $ref: '#/components/schemas/ShippingOption' }
